<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reserva | FoodxEver</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    >

</head>


<body class="bg-light">


    <nav th:replace="~{fragments/navbar :: navbar('reservas')}"
        class="navbar navbar-dark bg-success"
    >

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                th:href="@{/}"
            >

                <i class="bi bi-basket2-fill me-2"></i>

                FoodxEver

            </a>

        </div>

    </nav>



    <main class="py-5">

        <div class="container">


            <div
                class="row justify-content-center"
            >

                <div class="col-lg-8">


                    <div
                        class="card border-0 shadow-sm"
                    >

                        <div
                            class="card-body p-4 p-md-5"
                        >


                            <span
                                class="text-success fw-bold"
                            >
                                FOODXEVER
                            </span>


                            <h1
                                class="h3 fw-bold mt-2"
                                th:text="${modoEdicion}
                                ? 'Editar reserva'
                                : 'Nueva reserva'"
                            >
                                Reserva
                            </h1>


                            <p class="text-secondary">

                                Selecciona el producto
                                y completa los datos.

                            </p>



                            <!-- ERROR STOCK -->

                            <div
                                class="alert alert-danger"
                                th:if="${param.error != null}"
                            >

                                <i
                                    class="bi bi-exclamation-circle me-2"
                                ></i>

                                No fue posible realizar la operación.
                                Comprueba el producto y la cantidad disponible.

                            </div>



                            <form
                                th:action="${modoEdicion}
                                    ? @{/reservas/actualizar/{id}(id=${reserva.id})}
                                    : @{/reservas/guardar}"
                                th:object="${reserva}"
                                method="post"
                            >


                                <div class="row g-3">


                                    <!-- CLIENTE -->

                                    <div class="col-12">

                                        <label
                                            class="form-label fw-semibold"
                                        >
                                            Cliente
                                        </label>


                                        <input
                                            type="text"
                                            class="form-control"
                                            th:field="*{cliente}"
                                            placeholder="Nombre del cliente"
                                            required
                                        >

                                    </div>



                                    <!-- ESTABLECIMIENTO: PRIMER DESPLEGABLE -->
                                    <div class="col-md-6">
                                        <label for="establecimientoSelect" class="form-label fw-semibold">Establecimiento</label>
                                        <select class="form-select"
                                                id="establecimientoSelect"
                                                th:field="*{establecimientoId}"
                                                th:attr="data-establecimiento-inicial=${reserva.establecimientoId}"
                                                required>
                                            <option value="">Selecciona un establecimiento</option>
                                            <option th:each="establecimiento : ${establecimientos}"
                                                    th:value="${establecimiento.id}"
                                                    th:text="${establecimiento.nombre}">
                                                Establecimiento
                                            </option>
                                        </select>
                                    </div>

                                    <!-- PRODUCTO: SEGUNDO DESPLEGABLE DEPENDIENTE -->
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold" for="productoSelect">Producto</label>
                                        <select class="form-select"
                                                id="productoSelect"
                                                th:field="*{productoId}"
                                                th:attr="data-edicion=${modoEdicion}"
                                                required>
                                            <option value="">Selecciona un producto</option>
                                            <option th:each="producto : ${productos}"
                                                    th:value="${producto.id}"
                                                    th:text="${producto.nombre + ' - S/ ' + #numbers.formatDecimal(producto.precio, 1, 2) + ' - Stock: ' + producto.stock}"
                                                    th:attr="data-precio=${producto.precio}">
                                                Producto
                                            </option>
                                        </select>
                                        <div class="form-text">La lista mostrará los productos del establecimiento seleccionado.</div>
                                    </div>



                                    <!-- CANTIDAD -->

                                    <div class="col-md-4">

                                        <label
                                            class="form-label fw-semibold"
                                        >
                                            Cantidad
                                        </label>


                                        <input
                                            type="number"
                                            min="1"
                                            class="form-control"
                                            id="cantidadInput"
                                            th:field="*{cantidad}"
                                            required
                                        >

                                    </div>



                                    <!-- TOTAL PREVISUALIZADO -->

                                    <div class="col-12">


                                        <div
                                            class="alert alert-success
                                            d-flex justify-content-between
                                            align-items-center"
                                        >

                                            <span>

                                                <i
                                                    class="bi bi-calculator me-2"
                                                ></i>

                                                Total estimado

                                            </span>


                                            <strong
                                                class="fs-5"
                                                id="totalPreview"
                                            >
                                                S/ 0.00
                                            </strong>

                                        </div>


                                    </div>



                                    <!-- ESTADO EN EDICIÓN -->

                                    <div
                                        class="col-12"
                                        th:if="${modoEdicion}"
                                    >

                                        <label
                                            class="form-label fw-semibold"
                                        >
                                            Estado
                                        </label>


                                        <select
                                            class="form-select"
                                            th:field="*{estado}"
                                        >

                                            <option value="Pendiente">
                                                Pendiente
                                            </option>

                                            <option value="Completada">
                                                Completada
                                            </option>

                                            <option value="Cancelada">
                                                Cancelada
                                            </option>

                                        </select>

                                    </div>


                                </div>



                                <div
                                    class="d-flex gap-2 mt-4"
                                >

                                    <a
                                        th:href="@{/reservas}"
                                        class="btn
                                        btn-outline-secondary"
                                    >
                                        Cancelar
                                    </a>


                                    <button
                                        type="submit"
                                        class="btn btn-success"
                                    >

                                        <i
                                            class="bi bi-check-circle me-1"
                                        ></i>


                                        <span
                                            th:text="${modoEdicion}
                                            ? 'Guardar cambios'
                                            : 'Crear reserva'"
                                        >
                                            Guardar
                                        </span>

                                    </button>

                                </div>


                            </form>


                        </div>

                    </div>


                </div>

            </div>

        </div>

    </main>



    <!-- LISTAS EN CASCADA Y CÁLCULO VISUAL -->
    <script>
        const establecimientoSelect = document.getElementById("establecimientoSelect");
        const productoSelect = document.getElementById("productoSelect");
        const cantidadInput = document.getElementById("cantidadInput");
        const totalPreview = document.getElementById("totalPreview");
        const esEdicion = productoSelect.dataset.edicion === "true";
        const establecimientoInicial = establecimientoSelect.dataset.establecimientoInicial || establecimientoSelect.value;
        const productoInicialId = productoSelect.value;
        const opcionInicial = productoSelect.selectedOptions[0];
        const textoProductoInicial = opcionInicial ? opcionInicial.textContent : "Producto reservado";
        const precioProductoInicial = opcionInicial ? (opcionInicial.dataset.precio || "0") : "0";

        function actualizarTotal() {
            const option = productoSelect.options[productoSelect.selectedIndex];
            const precio = Number(option?.dataset.precio || 0);
            const cantidad = Number(cantidadInput.value || 0);
            totalPreview.textContent = "S/ " + (precio * cantidad).toFixed(2);
        }

        async function cargarProductos(mantenerSeleccion = true) {
            const establecimientoId = establecimientoSelect.value;
            const seleccionadoAnterior = mantenerSeleccion ? productoSelect.value : "";
            productoSelect.replaceChildren(new Option("Selecciona un producto", ""));
            if (!establecimientoId) {
                actualizarTotal();
                return;
            }

            productoSelect.disabled = true;
            try {
                const respuesta = await fetch(`/reservas/productos-por-establecimiento/${establecimientoId}`);
                if (!respuesta.ok) throw new Error("No se pudieron cargar los productos.");
                const productos = await respuesta.json();
                productos.forEach(producto => {
                    const texto = `${producto.nombre} - S/ ${Number(producto.precio).toFixed(2)} - Stock: ${producto.stock}`;
                    const opcion = new Option(texto, producto.id);
                    opcion.dataset.precio = producto.precio;
                    productoSelect.add(opcion);
                });

                // En modo edición, conserva la referencia histórica si el producto
                // ya no está disponible en el catálogo actual.
                if (esEdicion && establecimientoId === String(establecimientoInicial)
                        && productoInicialId && !productos.some(p => String(p.id) === String(productoInicialId))) {
                    const historico = new Option(textoProductoInicial, productoInicialId);
                    historico.dataset.precio = precioProductoInicial;
                    productoSelect.add(historico);
                }

                if (seleccionadoAnterior && [...productoSelect.options].some(o => o.value === String(seleccionadoAnterior))) {
                    productoSelect.value = seleccionadoAnterior;
                } else if (productoInicialId && esEdicion && establecimientoId === String(establecimientoInicial)) {
                    productoSelect.value = productoInicialId;
                }
            } catch (error) {
                console.error(error);
            } finally {
                productoSelect.disabled = false;
                actualizarTotal();
            }
        }

        establecimientoSelect.addEventListener("change", () => cargarProductos(false));
        productoSelect.addEventListener("change", actualizarTotal);
        cantidadInput.addEventListener("input", actualizarTotal);
        document.addEventListener("DOMContentLoaded", () => cargarProductos(true));
    </script>

</body>

</html>
