<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reserva | FoodxEver</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    >

</head>


<body class="bg-light">


    <nav
        class="navbar navbar-dark bg-success"
    >

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                th:href="@{/}"
            >

                <i class="bi bi-basket2-fill me-2"></i>

                FoodxEver

            </a>

        </div>

    </nav>



    <main class="py-5">

        <div class="container">


            <div
                class="row justify-content-center"
            >

                <div class="col-lg-8">


                    <div
                        class="card border-0 shadow-sm"
                    >

                        <div
                            class="card-body p-4 p-md-5"
                        >


                            <span
                                class="text-success fw-bold"
                            >
                                FOODXEVER
                            </span>


                            <h1
                                class="h3 fw-bold mt-2"
                                th:text="${modoEdicion}
                                ? 'Editar reserva'
                                : 'Nueva reserva'"
                            >
                                Reserva
                            </h1>


                            <p class="text-secondary">

                                Selecciona el producto
                                y completa los datos.

                            </p>



                            <!-- ERROR STOCK -->

                            <div
                                class="alert alert-danger"
                                th:if="${param.error != null}"
                            >

                                <i
                                    class="bi bi-exclamation-circle me-2"
                                ></i>

                                No fue posible realizar la operación.
                                Comprueba el producto y la cantidad disponible.

                            </div>



                            <form
                                th:action="${modoEdicion}
                                    ? @{/reservas/actualizar/{id}(id=${reserva.id})}
                                    : @{/reservas/guardar}"
                                th:object="${reserva}"
                                method="post"
                            >


                                <div class="row g-3">


                                    <!-- CLIENTE -->

                                    <div class="col-12">

                                        <label
                                            class="form-label fw-semibold"
                                        >
                                            Cliente
                                        </label>


                                        <input
                                            type="text"
                                            class="form-control"
                                            th:field="*{cliente}"
                                            placeholder="Nombre del cliente"
                                            required
                                        >

                                    </div>



                                    <!-- PRODUCTO -->

                                    <div class="col-md-8">

                                        <label
                                            class="form-label fw-semibold"
                                        >
                                            Producto
                                        </label>


                                        <select
                                            class="form-select"
                                            id="productoSelect"
                                            th:field="*{productoId}"
                                            required
                                        >

                                            <option value="">
                                                Selecciona un producto
                                            </option>


                                            <option
                                                th:each="producto : ${productos}"
                                                th:value="${producto.id}"
                                                th:text="${producto.nombre
                                                    + ' - S/ '
                                                    + #numbers.formatDecimal(producto.precio, 1, 2)
                                                    + ' - Stock: '
                                                    + producto.stock}"
                                                th:attr="data-precio=${producto.precio}"
                                            >
                                                Producto
                                            </option>


                                        </select>

                                    </div>



                                    <!-- CANTIDAD -->

                                    <div class="col-md-4">

                                        <label
                                            class="form-label fw-semibold"
                                        >
                                            Cantidad
                                        </label>


                                        <input
                                            type="number"
                                            min="1"
                                            class="form-control"
                                            id="cantidadInput"
                                            th:field="*{cantidad}"
                                            required
                                        >

                                    </div>



                                    <!-- TOTAL PREVISUALIZADO -->

                                    <div class="col-12">


                                        <div
                                            class="alert alert-success
                                            d-flex justify-content-between
                                            align-items-center"
                                        >

                                            <span>

                                                <i
                                                    class="bi bi-calculator me-2"
                                                ></i>

                                                Total estimado

                                            </span>


                                            <strong
                                                class="fs-5"
                                                id="totalPreview"
                                            >
                                                S/ 0.00
                                            </strong>

                                        </div>


                                    </div>



                                    <!-- ESTADO EN EDICIÓN -->

                                    <div
                                        class="col-12"
                                        th:if="${modoEdicion}"
                                    >

                                        <label
                                            class="form-label fw-semibold"
                                        >
                                            Estado
                                        </label>


                                        <select
                                            class="form-select"
                                            th:field="*{estado}"
                                        >

                                            <option value="Pendiente">
                                                Pendiente
                                            </option>

                                            <option value="Completada">
                                                Completada
                                            </option>

                                            <option value="Cancelada">
                                                Cancelada
                                            </option>

                                        </select>

                                    </div>


                                </div>



                                <div
                                    class="d-flex gap-2 mt-4"
                                >

                                    <a
                                        th:href="@{/reservas}"
                                        class="btn
                                        btn-outline-secondary"
                                    >
                                        Cancelar
                                    </a>


                                    <button
                                        type="submit"
                                        class="btn btn-success"
                                    >

                                        <i
                                            class="bi bi-check-circle me-1"
                                        ></i>


                                        <span
                                            th:text="${modoEdicion}
                                            ? 'Guardar cambios'
                                            : 'Crear reserva'"
                                        >
                                            Guardar
                                        </span>

                                    </button>

                                </div>


                            </form>


                        </div>

                    </div>


                </div>

            </div>

        </div>

    </main>



    <!-- CÁLCULO VISUAL -->

    <script>

        const productoSelect =
            document.getElementById(
                "productoSelect"
            );

        const cantidadInput =
            document.getElementById(
                "cantidadInput"
            );

        const totalPreview =
            document.getElementById(
                "totalPreview"
            );


        function actualizarTotal() {

            const option =
                productoSelect.options[
                    productoSelect.selectedIndex
                ];


            const precio =
                Number(
                    option?.dataset.precio || 0
                );


            const cantidad =
                Number(
                    cantidadInput.value || 0
                );


            const total =
                precio * cantidad;


            totalPreview.textContent =
                "S/ " + total.toFixed(2);

        }


        productoSelect.addEventListener(
            "change",
            actualizarTotal
        );


        cantidadInput.addEventListener(
            "input",
            actualizarTotal
        );


        actualizarTotal();

    </script>


</body>

</html>
