<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Crear cuenta | FoodxEver</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    >


    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>


<body class="bg-light">


    <nav
        th:replace="~{fragments/navbar :: navbar('registro')}"
    ></nav>



    <main class="py-5">

        <div class="container">

            <div
                class="row justify-content-center"
            >

                <div class="col-lg-7">


                    <div
                        class="card border-0 shadow-sm"
                    >

                        <div
                            class="card-body p-4 p-md-5"
                        >


                            <span
                                class="text-success fw-bold"
                            >
                                FOODXEVER
                            </span>


                            <h1
                                class="h3 fw-bold mt-2"
                            >
                                Crear una cuenta
                            </h1>


                            <p
                                class="text-secondary mb-4"
                            >
                                Regístrate como consumidor
                                o establecimiento.
                            </p>



                            <div
                                class="alert alert-danger"
                                th:if="${error}"
                                th:text="${error}"
                            >
                            </div>



                            <form
                                th:action="@{/registro}"
                                th:object="${usuario}"
                                method="post"
                            >


                                <div class="row g-3">


                                    <!-- NOMBRE -->

                                    <div class="col-12">

                                        <label
                                            class="form-label fw-semibold"
                                        >
                                            Nombre
                                        </label>


                                        <input
                                            type="text"
                                            class="form-control"
                                            th:field="*{nombre}"
                                            required
                                        >

                                    </div>



                                    <!-- CORREO -->

                                    <div class="col-12">

                                        <label
                                            class="form-label fw-semibold"
                                        >
                                            Correo electrónico
                                        </label>


                                        <input
                                            type="email"
                                            class="form-control"
                                            th:field="*{correo}"
                                            required
                                        >

                                    </div>



                                    <!-- CONTRASEÑA -->

                                    <div class="col-12">

                                        <label
                                            class="form-label fw-semibold"
                                        >
                                            Contraseña
                                        </label>


                                        <input
                                            type="password"
                                            class="form-control"
                                            th:field="*{contrasena}"
                                            minlength="6"
                                            required
                                        >


                                        <div class="form-text">

                                            Mínimo 6 caracteres.

                                        </div>

                                    </div>



                                    <!-- ROL -->

                                    <div class="col-12">

                                        <label
                                            class="form-label fw-semibold"
                                        >
                                            Tipo de cuenta
                                        </label>


                                        <select
                                            id="rol"
                                            class="form-select"
                                            th:field="*{rol}"
                                            required
                                        >

                                            <option value="">
                                                Seleccionar
                                            </option>

                                            <option value="CONSUMIDOR">
                                                Consumidor
                                            </option>

                                            <option value="ESTABLECIMIENTO">
                                                Establecimiento
                                            </option>

                                        </select>

                                    </div>



                                    <!-- NEGOCIO -->

                                    <div
                                        class="col-12"
                                        id="campoEstablecimiento"
                                        style="display: none;"
                                    >

                                        <label
                                            class="form-label fw-semibold"
                                        >
                                            Nombre del establecimiento
                                        </label>


                                        <input
                                            type="text"
                                            id="nombreEstablecimiento"
                                            class="form-control"
                                            th:field="*{nombreEstablecimiento}"
                                            placeholder="Ej. Panadería Central"
                                        >

                                    </div>


                                </div>



                                <div
                                    class="d-grid mt-4"
                                >

                                    <button
                                        type="submit"
                                        class="btn
                                        btn-success
                                        btn-lg"
                                    >

                                        <i
                                            class="bi bi-person-plus me-1"
                                        ></i>

                                        Crear cuenta

                                    </button>

                                </div>


                            </form>



                            <p
                                class="text-center
                                text-secondary
                                mt-4 mb-0"
                            >

                                ¿Ya tienes una cuenta?

                                <a
                                    th:href="@{/login}"
                                    class="text-success
                                    fw-semibold"
                                >
                                    Inicia sesión
                                </a>

                            </p>


                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>



    <script>

        const rol =
            document.getElementById("rol");

        const campo =
            document.getElementById(
                "campoEstablecimiento"
            );

        const nombreEstablecimiento =
            document.getElementById(
                "nombreEstablecimiento"
            );


        function actualizarRol() {

            const esEstablecimiento =
                rol.value ===
                "ESTABLECIMIENTO";


            campo.style.display =
                esEstablecimiento
                    ? "block"
                    : "none";


            nombreEstablecimiento.required =
                esEstablecimiento;

        }


        rol.addEventListener(
            "change",
            actualizarRol
        );


        actualizarRol();

    </script>


</body>

</html>
