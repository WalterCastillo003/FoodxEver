<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Detalle del producto | FoodxEver</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    >

</head>


<body class="bg-light">


    <nav th:replace="~{fragments/navbar :: navbar('productos')}" class="navbar navbar-dark bg-success">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                th:href="@{/}"
            >

                <i
                    class="bi bi-basket2-fill me-2"
                ></i>

                FoodxEver

            </a>

        </div>

    </nav>



    <main class="py-5">

        <div class="container">

            <div
                class="row
                justify-content-center"
            >

                <div class="col-lg-8">


                    <a
                        th:href="@{/productos}"
                        class="btn
                        btn-outline-secondary mb-4"
                    >

                        <i
                            class="bi bi-arrow-left"
                        ></i>

                        Volver

                    </a>



                    <div
                        class="card
                        border-0 shadow-sm"
                    >

                        <div
                            class="card-body p-5"
                        >


                            <div
                                class="d-flex
                                justify-content-between
                                align-items-start
                                gap-3 mb-4"
                            >

                                <div>

                                    <span
                                        class="text-success
                                        fw-bold"
                                        th:text="${producto.categoria}"
                                    >
                                        Categoría
                                    </span>


                                    <h1
                                        class="fw-bold mt-2"
                                        th:text="${producto.nombre}"
                                    >
                                        Producto
                                    </h1>

                                </div>


                                <span
                                    th:if="${producto.activo}"
                                    class="badge
                                    bg-success fs-6"
                                >
                                    Activo
                                </span>


                                <span
                                    th:unless="${producto.activo}"
                                    class="badge
                                    bg-secondary fs-6"
                                >
                                    Inactivo
                                </span>


                            </div>



                            <hr>



                            <div class="row g-4 my-2">


                                <div class="col-md-4">

                                    <small
                                        class="text-secondary"
                                    >
                                        Precio FoodxEver
                                    </small>


                                    <h4
                                        class="text-success fw-bold"
                                        th:text="'S/ ' + ${#numbers.formatDecimal(producto.precio, 1, 2)}"
                                    >
                                        S/ 0.00
                                    </h4>

                                </div>



                                <div class="col-md-4">

                                    <small
                                        class="text-secondary"
                                    >
                                        Precio original
                                    </small>


                                    <h4
                                        th:text="'S/ ' + ${#numbers.formatDecimal(producto.precioOriginal, 1, 2)}"
                                    >
                                        S/ 0.00
                                    </h4>

                                </div>



                                <div class="col-md-4">

                                    <small
                                        class="text-secondary"
                                    >
                                        Stock
                                    </small>


                                    <h4
                                        th:text="${producto.stock}"
                                    >
                                        0
                                    </h4>

                                </div>


                            </div>



                            <hr>



                            <div class="mb-4">

                                <h5 class="fw-bold">

                                    Descripción

                                </h5>


                                <p
                                    class="text-secondary"
                                    th:text="${producto.descripcion}"
                                >
                                    Descripción.
                                </p>

                            </div>



                            <div class="mb-4">

                                <h5 class="fw-bold">

                                    Horario de recojo

                                </h5>


                                <p>

                                    <i
                                        class="bi bi-clock
                                        text-success me-2"
                                    ></i>


                                    <span
                                        th:text="${producto.horarioRecojo}"
                                    >
                                        Horario
                                    </span>

                                </p>

                            </div>



                            <div class="d-flex gap-2">


                                <a
                                    th:href="@{/productos/editar/{id}(id=${producto.id})}"
                                    class="btn btn-success"
                                >

                                    <i
                                        class="bi bi-pencil me-1"
                                    ></i>

                                    Editar

                                </a>


                                <a
                                    th:href="@{/productos}"
                                    class="btn
                                    btn-outline-secondary"
                                >

                                    Productos

                                </a>


                            </div>


                        </div>

                    </div>


                </div>

            </div>

        </div>

    </main>


</body>

</html>
