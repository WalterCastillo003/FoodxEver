<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mi perfil | FoodxEver</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    >


    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>


<body class="bg-light">


    <nav
        th:replace="~{fragments/navbar :: navbar('perfil')}"
    ></nav>



    <main class="py-5">

        <div class="container">

            <div
                class="row justify-content-center"
            >

                <div class="col-lg-7">


                    <div
                        class="card border-0 shadow-sm"
                    >

                        <div
                            class="card-body p-5"
                        >


                            <div
                                class="text-center mb-4"
                            >

                                <div
                                    class="display-3 text-success"
                                >

                                    <i
                                        class="bi bi-person-circle"
                                    ></i>

                                </div>


                                <h1
                                    class="h3 fw-bold mt-3"
                                    th:text="${usuario.nombre}"
                                >
                                    Usuario
                                </h1>


                                <span
                                    class="badge bg-success"
                                    th:text="${usuario.rol}"
                                >
                                    ROL
                                </span>

                            </div>



                            <hr>



                            <div class="row g-4 mt-2">


                                <div class="col-md-6">

                                    <small
                                        class="text-secondary"
                                    >
                                        Correo electrónico
                                    </small>


                                    <p
                                        class="fw-semibold"
                                        th:text="${usuario.correo}"
                                    >
                                        correo
                                    </p>

                                </div>



                                <div
                                    class="col-md-6"
                                    th:if="${usuario.rol == 'ESTABLECIMIENTO'}"
                                >

                                    <small
                                        class="text-secondary"
                                    >
                                        Establecimiento
                                    </small>


                                    <p
                                        class="fw-semibold"
                                        th:text="${usuario.nombreEstablecimiento}"
                                    >
                                        Establecimiento
                                    </p>

                                </div>


                            </div>



                            <hr>



                            <form
                                th:action="@{/logout}"
                                method="post"
                            >

                                <button
                                    type="submit"
                                    class="btn btn-outline-danger"
                                >

                                    <i
                                        class="bi bi-box-arrow-right me-1"
                                    ></i>

                                    Cerrar sesión

                                </button>

                            </form>


                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


</body>

</html>
