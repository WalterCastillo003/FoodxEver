<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Establecimiento | FoodxEver</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    >

</head>


<body class="bg-light">


    <nav th:replace="~{fragments/navbar :: navbar('establecimientos')}"
        class="navbar navbar-dark
        bg-success"
    >

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                th:href="@{/}"
            >

                <i
                    class="bi bi-basket2-fill me-2"
                ></i>

                FoodxEver

            </a>

        </div>

    </nav>



    <main class="py-5">

        <div class="container">

            <div
                class="row justify-content-center"
            >

                <div class="col-lg-8">


                    <div
                        class="card border-0 shadow-sm"
                    >

                        <div
                            class="card-body p-4 p-md-5"
                        >


                            <span
                                class="text-success fw-bold"
                            >
                                FOODXEVER
                            </span>


                            <h1
                                class="h3 fw-bold mt-2"
                                th:text="${modoEdicion}
                                ? 'Editar establecimiento'
                                : 'Nuevo establecimiento'"
                            >
                                Establecimiento
                            </h1>


                            <p class="text-secondary mb-4">

                                Completa la información
                                del negocio.

                            </p>



                            <form
                                th:action="${modoEdicion}
                                    ? @{/establecimientos/actualizar/{id}(id=${establecimiento.id})}
                                    : @{/establecimientos/guardar}"
                                th:object="${establecimiento}"
                                method="post"
                            >


                                <div class="row g-3">


                                    <!-- NOMBRE -->

                                    <div class="col-12">

                                        <label
                                            class="form-label fw-semibold"
                                        >
                                            Nombre
                                        </label>


                                        <input
                                            type="text"
                                            class="form-control"
                                            th:field="*{nombre}"
                                            required
                                        >

                                    </div>



                                    <!-- CATEGORÍA -->

                                    <div class="col-md-6">

                                        <label
                                            class="form-label fw-semibold"
                                        >
                                            Categoría
                                        </label>


                                        <select
                                            class="form-select"
                                            th:field="*{categoria}"
                                            required
                                        >

                                            <option value="">
                                                Seleccionar
                                            </option>

                                            <option value="Panadería">
                                                Panadería
                                            </option>

                                            <option value="Cafetería">
                                                Cafetería
                                            </option>

                                            <option value="Restaurante">
                                                Restaurante
                                            </option>

                                            <option value="Market">
                                                Market
                                            </option>

                                        </select>

                                    </div>



                                    <!-- TELÉFONO -->

                                    <div class="col-md-6">

                                        <label
                                            class="form-label fw-semibold"
                                        >
                                            Teléfono
                                        </label>


                                        <input
                                            type="text"
                                            class="form-control"
                                            th:field="*{telefono}"
                                            required
                                        >

                                    </div>



                                    <!-- DIRECCIÓN -->

                                    <div class="col-12">

                                        <label
                                            class="form-label fw-semibold"
                                        >
                                            Dirección
                                        </label>


                                        <input
                                            type="text"
                                            class="form-control"
                                            th:field="*{direccion}"
                                            required
                                        >

                                    </div>



                                    <!-- CORREO -->

                                    <div class="col-12">

                                        <label
                                            class="form-label fw-semibold"
                                        >
                                            Correo electrónico
                                        </label>


                                        <input
                                            type="email"
                                            class="form-control"
                                            th:field="*{correo}"
                                            required
                                        >

                                    </div>


                                </div>



                                <div
                                    class="d-flex gap-2 mt-4"
                                >

                                    <a
                                        th:href="@{/establecimientos}"
                                        class="btn
                                        btn-outline-secondary"
                                    >
                                        Cancelar
                                    </a>


                                    <button
                                        type="submit"
                                        class="btn btn-success"
                                    >

                                        <i
                                            class="bi bi-check-circle me-1"
                                        ></i>

                                        <span
                                            th:text="${modoEdicion}
                                            ? 'Guardar cambios'
                                            : 'Crear establecimiento'"
                                        >
                                            Guardar
                                        </span>

                                    </button>

                                </div>


                            </form>


                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


</body>

</html>
