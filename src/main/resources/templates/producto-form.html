<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Producto | FoodxEver</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    >


    <!-- CSS FoodxEver -->

    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>


<body class="bg-light">


    <!-- =========================================
         NAVBAR
    ========================================== -->

    <nav
        th:replace="~{fragments/navbar :: navbar('productos')}"
    ></nav>



    <!-- =========================================
         CONTENIDO
    ========================================== -->

    <main class="py-5">

        <div class="container">


            <div
                class="row justify-content-center"
            >

                <div class="col-lg-8">


                    <div
                        class="card border-0 shadow-sm"
                    >

                        <div
                            class="card-body p-4 p-md-5"
                        >


                            <!-- ENCABEZADO -->

                            <div class="mb-4">


                                <span
                                    class="text-success fw-bold"
                                >
                                    FOODXEVER
                                </span>


                                <h1
                                    class="h3 fw-bold mt-2"
                                    th:text="${modoEdicion}
                                        ? 'Editar producto'
                                        : 'Nuevo producto'"
                                >
                                    Producto
                                </h1>


                                <p
                                    class="text-secondary mb-0"
                                >
                                    Completa la información
                                    del alimento.
                                </p>


                            </div>



                            <!-- =================================
                                 FORMULARIO
                            ================================== -->

                            <form
                                th:action="${modoEdicion}
                                    ? @{/productos/actualizar/{id}(id=${producto.id})}
                                    : @{/productos/guardar}"
                                th:object="${producto}"
                                method="post"
                            >


                                <div class="row g-3">


                                    <!-- =========================
                                         NOMBRE
                                    ========================== -->

                                    <div class="col-12">

                                        <label
                                            for="nombre"
                                            class="form-label fw-semibold"
                                        >
                                            Nombre del producto
                                        </label>


                                        <input
                                            type="text"
                                            id="nombre"
                                            class="form-control"
                                            th:field="*{nombre}"
                                            placeholder="Ej. Pack sorpresa de panadería"
                                            required
                                        >

                                    </div>



                                    <!-- =========================
                                         CATEGORÍA
                                    ========================== -->

                                    <div class="col-md-6">

                                        <label
                                            for="categoria"
                                            class="form-label fw-semibold"
                                        >
                                            Categoría
                                        </label>


                                        <select
                                            id="categoria"
                                            class="form-select"
                                            th:field="*{categoria}"
                                            required
                                        >

                                            <option value="">
                                                Seleccionar categoría
                                            </option>


                                            <option value="Panadería">
                                                Panadería
                                            </option>


                                            <option value="Cafetería">
                                                Cafetería
                                            </option>


                                            <option value="Restaurante">
                                                Restaurante
                                            </option>


                                            <option value="Market">
                                                Market
                                            </option>

                                        </select>

                                    </div>



                                    <!-- =========================
                                         STOCK
                                    ========================== -->

                                    <div class="col-md-6">

                                        <label
                                            for="stock"
                                            class="form-label fw-semibold"
                                        >
                                            Stock disponible
                                        </label>


                                        <input
                                            type="number"
                                            id="stock"
                                            min="0"
                                            class="form-control"
                                            th:field="*{stock}"
                                            required
                                        >

                                    </div>



                                    <!-- =========================
                                         PRECIO FOODXEVER
                                    ========================== -->

                                    <div class="col-md-6">

                                        <label
                                            for="precio"
                                            class="form-label fw-semibold"
                                        >
                                            Precio FoodxEver
                                        </label>


                                        <div class="input-group">

                                            <span
                                                class="input-group-text"
                                            >
                                                S/
                                            </span>


                                            <input
                                                type="number"
                                                id="precio"
                                                min="0"
                                                step="0.01"
                                                class="form-control"
                                                th:field="*{precio}"
                                                placeholder="0.00"
                                                required
                                            >

                                        </div>

                                    </div>



                                    <!-- =========================
                                         PRECIO ORIGINAL
                                    ========================== -->

                                    <div class="col-md-6">

                                        <label
                                            for="precioOriginal"
                                            class="form-label fw-semibold"
                                        >
                                            Precio original
                                        </label>


                                        <div class="input-group">

                                            <span
                                                class="input-group-text"
                                            >
                                                S/
                                            </span>


                                            <input
                                                type="number"
                                                id="precioOriginal"
                                                min="0"
                                                step="0.01"
                                                class="form-control"
                                                th:field="*{precioOriginal}"
                                                placeholder="0.00"
                                                required
                                            >

                                        </div>

                                    </div>



                                    <!-- =========================
                                         HORARIO DE RECOJO
                                    ========================== -->

                                    <div class="col-12">

                                        <label
                                            for="horarioRecojo"
                                            class="form-label fw-semibold"
                                        >
                                            Horario de recojo
                                        </label>


                                        <input
                                            type="text"
                                            id="horarioRecojo"
                                            class="form-control"
                                            th:field="*{horarioRecojo}"
                                            placeholder="Ej. 7:00 PM - 9:00 PM"
                                            required
                                        >

                                    </div>



                                    <!-- =========================
                                         DESCRIPCIÓN
                                    ========================== -->

                                    <div class="col-12">

                                        <label
                                            for="descripcion"
                                            class="form-label fw-semibold"
                                        >
                                            Descripción
                                        </label>


                                        <textarea
                                            id="descripcion"
                                            class="form-control"
                                            rows="4"
                                            th:field="*{descripcion}"
                                            placeholder="Describe brevemente el producto..."
                                            required
                                        ></textarea>

                                    </div>

<!-- =========================
     IMAGEN
========================== -->

<div class="col-12">

    <label
        for="imagen"
        class="form-label fw-semibold"
    >
        Imagen del producto
    </label>


    <select
        id="imagen"
        class="form-select"
        th:field="*{imagen}"
        required
    >

        <option value="">
            Seleccionar imagen
        </option>


        <option value="/img/panaderia.jpg">
            Panadería
        </option>


        <option value="/img/postres.jpg">
            Postres
        </option>


        <option value="/img/pizza.jpg">
            Pizza
        </option>


        <option value="/img/frutas-verduras.jpg">
            Frutas y verduras
        </option>


        <option value="/img/menu-ejecutivo.jpg">
            Menú ejecutivo
        </option>


        <option value="/img/sandwich-cafe.jpg">
            Sándwich y café
        </option>


        <option value="/img/hero-foodxever.jpg">
            Alimentos variados
        </option>

    </select>


    <div class="form-text">

        Las imágenes están almacenadas
        localmente dentro de FoodxEver.

    </div>

</div>

                                    <!-- =========================
                                         ACTIVO
                                    ========================== -->

                                    <div class="col-12">

                                        <div
                                            class="card bg-light border-0"
                                        >

                                            <div
                                                class="card-body"
                                            >

                                                <div
                                                    class="form-check form-switch"
                                                >

                                                    <input
                                                        class="form-check-input"
                                                        type="checkbox"
                                                        role="switch"
                                                        id="activo"
                                                        th:field="*{activo}"
                                                    >


                                                    <label
                                                        class="form-check-label fw-semibold"
                                                        for="activo"
                                                    >
                                                        Producto activo
                                                    </label>


                                                    <div
                                                        class="form-text"
                                                    >
                                                        Los productos activos
                                                        están disponibles
                                                        en la plataforma.
                                                    </div>

                                                </div>

                                            </div>

                                        </div>

                                    </div>


                                </div>



                                <!-- =================================
                                     BOTONES
                                ================================== -->

                                <div
                                    class="d-flex
                                    flex-column
                                    flex-sm-row
                                    gap-2
                                    mt-4"
                                >


                                    <a
                                        th:href="@{/productos}"
                                        class="btn btn-outline-secondary"
                                    >

                                        <i
                                            class="bi bi-arrow-left me-1"
                                        ></i>

                                        Cancelar

                                    </a>



                                    <button
                                        type="submit"
                                        class="btn btn-success"
                                    >

                                        <i
                                            class="bi bi-check-circle me-1"
                                        ></i>


                                        <span
                                            th:text="${modoEdicion}
                                                ? 'Guardar cambios'
                                                : 'Crear producto'"
                                        >
                                            Guardar
                                        </span>

                                    </button>


                                </div>


                            </form>


                        </div>

                    </div>


                </div>

            </div>


        </div>

    </main>



    <!-- =========================================
         BOOTSTRAP JS
    ========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


</body>

</html>
