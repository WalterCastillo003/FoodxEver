<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Producto | FoodxEver</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    >


    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>


<body class="bg-light">


    <nav
        class="navbar navbar-dark
        bg-success"
    >

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                th:href="@{/}"
            >

                <i
                    class="bi bi-basket2-fill me-2"
                ></i>

                FoodxEver

            </a>

        </div>

    </nav>



    <main class="py-5">

        <div class="container">


            <div
                class="row
                justify-content-center"
            >

                <div
                    class="col-lg-8"
                >


                    <div
                        class="card
                        border-0 shadow-sm"
                    >

                        <div
                            class="card-body p-4 p-md-5"
                        >


                            <div class="mb-4">


                                <span
                                    class="text-success fw-bold"
                                >
                                    FOODXEVER
                                </span>


                                <h1
                                    class="h3 fw-bold mt-2"
                                    th:text="${modoEdicion}
                                        ? 'Editar producto'
                                        : 'Nuevo producto'"
                                >
                                    Producto
                                </h1>


                                <p
                                    class="text-secondary"
                                >
                                    Completa la información
                                    del alimento.
                                </p>


                            </div>



                            <!-- =====================
                                 FORMULARIO EDICIÓN
                            ====================== -->

                            <form
                                th:if="${modoEdicion}"
                                th:action="@{/productos/actualizar/{id}(id=${producto.id})}"
                                th:object="${producto}"
                                method="post"
                            >

                                <div
                                    th:replace="~{producto-form :: camposProducto}"
                                ></div>


                                <div class="d-flex gap-2 mt-4">

                                    <a
                                        th:href="@{/productos}"
                                        class="btn
                                        btn-outline-secondary"
                                    >
                                        Cancelar
                                    </a>


                                    <button
                                        class="btn btn-success"
                                        type="submit"
                                    >

                                        Guardar cambios

                                    </button>

                                </div>


                            </form>



                            <!-- =====================
                                 FORMULARIO NUEVO
                            ====================== -->

                            <form
                                th:unless="${modoEdicion}"
                                th:action="@{/productos/guardar}"
                                th:object="${producto}"
                                method="post"
                            >

                                <div
                                    th:replace="~{producto-form :: camposProducto}"
                                ></div>


                                <div class="d-flex gap-2 mt-4">

                                    <a
                                        th:href="@{/productos}"
                                        class="btn
                                        btn-outline-secondary"
                                    >
                                        Cancelar
                                    </a>


                                    <button
                                        class="btn btn-success"
                                        type="submit"
                                    >

                                        Crear producto

                                    </button>

                                </div>


                            </form>


                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>



    <!-- =========================================
         FRAGMENTO DE CAMPOS
    ========================================== -->

    <div
        th:fragment="camposProducto"
    >


        <div class="row g-3">


            <!-- NOMBRE -->

            <div class="col-12">

                <label
                    class="form-label fw-semibold"
                >
                    Nombre
                </label>

                <input
                    type="text"
                    class="form-control"
                    th:field="*{nombre}"
                    required
                >

            </div>



            <!-- CATEGORÍA -->

            <div class="col-md-6">

                <label
                    class="form-label fw-semibold"
                >
                    Categoría
                </label>


                <select
                    class="form-select"
                    th:field="*{categoria}"
                    required
                >

                    <option value="">
                        Seleccionar
                    </option>

                    <option value="Panadería">
                        Panadería
                    </option>

                    <option value="Cafetería">
                        Cafetería
                    </option>

                    <option value="Restaurante">
                        Restaurante
                    </option>

                    <option value="Market">
                        Market
                    </option>

                </select>

            </div>



            <!-- STOCK -->

            <div class="col-md-6">

                <label
                    class="form-label fw-semibold"
                >
                    Stock
                </label>

                <input
                    type="number"
                    min="0"
                    class="form-control"
                    th:field="*{stock}"
                    required
                >

            </div>



            <!-- PRECIO -->

            <div class="col-md-6">

                <label
                    class="form-label fw-semibold"
                >
                    Precio FoodxEver
                </label>

                <input
                    type="number"
                    min="0"
                    step="0.01"
                    class="form-control"
                    th:field="*{precio}"
                    required
                >

            </div>



            <!-- PRECIO ORIGINAL -->

            <div class="col-md-6">

                <label
                    class="form-label fw-semibold"
                >
                    Precio original
                </label>

                <input
                    type="number"
                    min="0"
                    step="0.01"
                    class="form-control"
                    th:field="*{precioOriginal}"
                    required
                >

            </div>



            <!-- HORARIO -->

            <div class="col-12">

                <label
                    class="form-label fw-semibold"
                >
                    Horario de recojo
                </label>

                <input
                    type="text"
                    class="form-control"
                    th:field="*{horarioRecojo}"
                    placeholder="Ej. 7:00 PM - 9:00 PM"
                    required
                >

            </div>



            <!-- DESCRIPCIÓN -->

            <div class="col-12">

                <label
                    class="form-label fw-semibold"
                >
                    Descripción
                </label>

                <textarea
                    class="form-control"
                    rows="4"
                    th:field="*{descripcion}"
                    required
                ></textarea>

            </div>



            <!-- ACTIVO -->

            <div class="col-12">

                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        th:field="*{activo}"
                    >

                    <label
                        class="form-check-label"
                    >
                        Producto activo
                    </label>

                </div>

            </div>


        </div>


    </div>



    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>

</html>
