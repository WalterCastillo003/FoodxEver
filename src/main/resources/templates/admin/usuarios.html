<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios | Administración FoodxEver</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/navbar :: navbar('administracion')}"></nav>
<main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div><a th:href="@{/administracion}" class="text-success text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Administración</a><h1 class="h2 fw-bold mt-2">Usuarios</h1><p class="text-secondary mb-0">Gestiona las cuentas registradas en FoodxEver.</p></div>
        <a class="btn btn-success" th:href="@{/administracion/usuarios/nuevo}"><i class="bi bi-person-plus me-1"></i>Nuevo usuario</a>
    </div>
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
        <thead class="table-success"><tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Rol</th><th>Establecimiento</th><th class="text-end">Acciones</th></tr></thead>
        <tbody><tr th:each="usuario : ${usuarios}"><td th:text="${usuario.id}"></td><td class="fw-semibold" th:text="${usuario.nombre}"></td><td th:text="${usuario.correo}"></td><td><span class="badge text-bg-secondary" th:text="${usuario.rol}"></span></td><td th:text="${usuario.nombreEstablecimiento != null ? usuario.nombreEstablecimiento : '—'}"></td><td class="text-end text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/administracion/usuarios/editar/{id}(id=${usuario.id})}"><i class="bi bi-pencil"></i></a> <form class="d-inline" method="post" th:action="@{/administracion/usuarios/eliminar/{id}(id=${usuario.id})}" onsubmit="return confirm('¿Eliminar este usuario?')"><button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button></form></td></tr>
        <tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="6" class="text-center text-secondary py-4">No hay usuarios registrados.</td></tr></tbody>
    </table></div></div>
    <p class="small text-secondary mt-3 mb-0">Las contraseñas nunca se muestran. Los usuarios vinculados a reservas, reseñas o establecimientos no se pueden eliminar.</p>
</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
