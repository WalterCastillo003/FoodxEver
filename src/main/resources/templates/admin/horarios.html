<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Horarios de recojo | FoodxEver</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body class="bg-light"><nav th:replace="~{fragments/navbar :: navbar('administracion')}"></nav><main class="container py-5"><div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><a th:href="@{/administracion}" class="text-success text-decoration-none">← Administración</a><h1 class="h2 fw-bold mt-2">Horarios de recojo</h1><p class="text-secondary mb-0">Configura los días y rangos de recojo de cada establecimiento.</p></div><a class="btn btn-success" th:href="@{/administracion/horarios/nuevo}">Nuevo horario</a></div><div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-success"><tr><th>ID</th><th>Establecimiento</th><th>Día</th><th>Desde</th><th>Hasta</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead><tbody><tr th:each="horario : ${horarios}"><td th:text="${horario.id}"></td><td class="fw-semibold" th:text="${horario.establecimiento.nombre}"></td><td th:text="${horario.diaSemana}"></td><td th:text="${horario.horaInicio}"></td><td th:text="${horario.horaFin}"></td><td><span class="badge" th:classappend="${horario.activo ? ' text-bg-success' : ' text-bg-secondary'}" th:text="${horario.activo ? 'Activo' : 'Inactivo'}"></span></td><td class="text-end text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/administracion/horarios/editar/{id}(id=${horario.id})}"><i class="bi bi-pencil"></i></a> <form class="d-inline" method="post" th:action="@{/administracion/horarios/eliminar/{id}(id=${horario.id})}" onsubmit="return confirm('¿Eliminar este horario?')"><button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button></form></td></tr><tr th:if="${#lists.isEmpty(horarios)}"><td colspan="7" class="text-center text-secondary py-4">No hay horarios registrados.</td></tr></tbody></table></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
