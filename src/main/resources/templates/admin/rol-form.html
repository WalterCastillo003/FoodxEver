<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rol | FoodxEver</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body class="bg-light"><nav th:replace="~{fragments/navbar :: navbar('administracion')}"></nav><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><a th:href="@{/administracion/roles}" class="text-success text-decoration-none">← Volver a roles</a><div class="card border-0 shadow-sm mt-3"><div class="card-body p-4"><h1 class="h3 fw-bold" th:text="${modoEdicion ? 'Editar rol' : 'Nuevo rol'}"></h1><form method="post" th:action="${formAction}" th:object="${rol}"><div class="mb-3"><label class="form-label">Nombre</label><input class="form-control text-uppercase" th:field="*{nombre}" maxlength="40" required></div><div class="mb-4"><label class="form-label">Descripción</label><textarea class="form-control" th:field="*{descripcion}" rows="3" maxlength="180"></textarea></div><button class="btn btn-success" type="submit">Guardar</button> <a class="btn btn-outline-secondary" th:href="@{/administracion/roles}">Cancelar</a></form></div></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
