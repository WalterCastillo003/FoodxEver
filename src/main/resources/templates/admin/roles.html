<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Roles | FoodxEver</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body class="bg-light"><nav th:replace="~{fragments/navbar :: navbar('administracion')}"></nav>
<main class="container py-5"><div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><a th:href="@{/administracion}" class="text-success text-decoration-none">← Administración</a><h1 class="h2 fw-bold mt-2">Roles</h1><p class="text-secondary mb-0">Define los perfiles disponibles para las cuentas.</p></div><a class="btn btn-success" th:href="@{/administracion/roles/nuevo}">Nuevo rol</a></div>
<div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-success"><tr><th>ID</th><th>Nombre</th><th>Descripción</th><th class="text-end">Acciones</th></tr></thead><tbody><tr th:each="rol : ${roles}"><td th:text="${rol.id}"></td><td class="fw-semibold" th:text="${rol.nombre}"></td><td th:text="${rol.descripcion != null ? rol.descripcion : '—'}"></td><td class="text-end text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/administracion/roles/editar/{id}(id=${rol.id})}"><i class="bi bi-pencil"></i></a> <form class="d-inline" method="post" th:action="@{/administracion/roles/eliminar/{id}(id=${rol.id})}" onsubmit="return confirm('¿Eliminar este rol?')"><button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button></form></td></tr><tr th:if="${#lists.isEmpty(roles)}"><td colspan="4" class="text-center text-secondary py-4">No hay roles.</td></tr></tbody></table></div></div>
<div class="alert alert-info mt-3">Los roles ADMIN, CONSUMIDOR y ESTABLECIMIENTO son roles reservados y no se pueden eliminar. Tampoco se puede renombrar un rol asignado a usuarios.</div>
</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
