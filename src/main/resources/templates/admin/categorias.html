<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Categorías | FoodxEver</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body class="bg-light"><nav th:replace="~{fragments/navbar :: navbar('administracion')}"></nav><main class="container py-5"><div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><a th:href="@{/administracion}" class="text-success text-decoration-none">← Administración</a><h1 class="h2 fw-bold mt-2">Categorías</h1><p class="text-secondary mb-0">Clasifica los productos según el tipo de establecimiento.</p></div><a class="btn btn-success" th:href="@{/administracion/categorias/nuevo}">Nueva categoría</a></div><div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-success"><tr><th>ID</th><th>Categoría</th><th>Tipo de establecimiento</th><th>Descripción</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead><tbody><tr th:each="categoria : ${categorias}"><td th:text="${categoria.id}"></td><td class="fw-semibold" th:text="${categoria.nombre}"></td><td th:text="${categoria.tipoEstablecimiento}"></td><td th:text="${categoria.descripcion != null ? categoria.descripcion : '—'}"></td><td><span class="badge" th:classappend="${categoria.activa ? ' text-bg-success' : ' text-bg-secondary'}" th:text="${categoria.activa ? 'Activa' : 'Inactiva'}"></span></td><td class="text-end text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/administracion/categorias/editar/{id}(id=${categoria.id})}"><i class="bi bi-pencil"></i></a> <form class="d-inline" method="post" th:action="@{/administracion/categorias/eliminar/{id}(id=${categoria.id})}" onsubmit="return confirm('¿Eliminar esta categoría?')"><button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button></form></td></tr><tr th:if="${#lists.isEmpty(categorias)}"><td colspan="6" class="text-center text-secondary py-4">No hay categorías.</td></tr></tbody></table></div></div><p class="small text-secondary mt-3">No se permite eliminar o desactivar categorías que estén asignadas a productos.</p></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
