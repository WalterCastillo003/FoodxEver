<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${modoEdicion ? 'Editar usuario' : 'Nuevo usuario'} + ' | FoodxEver'">Usuario | FoodxEver</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/navbar :: navbar('administracion')}"></nav>
<main class="container py-5"><div class="row justify-content-center"><div class="col-lg-8">
    <a th:href="@{/administracion/usuarios}" class="text-success text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Volver a usuarios</a>
    <div class="card border-0 shadow-sm mt-3"><div class="card-body p-4 p-md-5">
        <h1 class="h3 fw-bold" th:text="${modoEdicion ? 'Editar usuario' : 'Registrar usuario'}"></h1>
        <p class="text-secondary">Completa los datos de la cuenta.</p>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <form method="post" th:action="${formAction}" th:object="${usuarioForm}">
            <div class="mb-3"><label class="form-label">Nombre completo</label><input class="form-control" th:field="*{nombre}" maxlength="100" required></div>
            <div class="mb-3"><label class="form-label">Correo electrónico</label><input type="email" class="form-control" th:field="*{correo}" maxlength="160" required></div>
            <div class="mb-3"><label class="form-label">Rol</label><select class="form-select" th:field="*{rolId}" required><option value="">Seleccionar rol</option><option th:each="rol : ${roles}" th:value="${rol.id}" th:text="${rol.nombre}"></option></select></div>
            <div class="mb-3"><label class="form-label" th:text="${modoEdicion ? 'Nueva contraseña (opcional)' : 'Contraseña'}"></label><input type="password" class="form-control" th:field="*{contrasena}" minlength="6" th:required="${passwordRequired}" autocomplete="new-password"><div class="form-text" th:text="${modoEdicion ? 'Déjala en blanco para conservar la contraseña actual.' : 'Mínimo 6 caracteres. Se almacenará cifrada.'}"></div></div>
            <div class="mb-4"><label class="form-label">Nombre del establecimiento (solo para cuentas de tipo establecimiento)</label><input class="form-control" th:field="*{nombreEstablecimiento}" maxlength="120"></div>
            <div class="d-flex gap-2"><button class="btn btn-success" type="submit"><i class="bi bi-save me-1"></i>Guardar</button><a class="btn btn-outline-secondary" th:href="@{/administracion/usuarios}">Cancelar</a></div>
        </form>
    </div></div>
</div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
