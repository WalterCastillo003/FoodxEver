<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Horario de recojo | FoodxEver</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body class="bg-light"><nav th:replace="~{fragments/navbar :: navbar('administracion')}"></nav><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><a th:href="@{/administracion/horarios}" class="text-success text-decoration-none">← Volver a horarios</a><div class="card border-0 shadow-sm mt-3"><div class="card-body p-4"><h1 class="h3 fw-bold" th:text="${modoEdicion ? 'Editar horario' : 'Nuevo horario'}"></h1><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form method="post" th:action="${formAction}" th:object="${horarioForm}"><div class="mb-3"><label class="form-label">Establecimiento</label><select class="form-select" th:field="*{establecimientoId}" required><option value="">Seleccionar establecimiento</option><option th:each="establecimiento : ${establecimientos}" th:value="${establecimiento.id}" th:text="${establecimiento.nombre}"></option></select></div><div class="mb-3"><label class="form-label">Día de la semana</label><select class="form-select" th:field="*{diaSemana}" required><option value="">Seleccionar día</option><option th:each="dia : ${diasSemana}" th:value="${dia}" th:text="${dia}"></option></select></div><div class="row g-3 mb-3"><div class="col-md-6"><label class="form-label">Hora de inicio</label><input type="time" class="form-control" th:field="*{horaInicio}" required></div><div class="col-md-6"><label class="form-label">Hora de fin</label><input type="time" class="form-control" th:field="*{horaFin}" required></div></div><div class="form-check mb-4"><input class="form-check-input" type="checkbox" th:field="*{activo}"><label class="form-check-label">Horario activo</label></div><button class="btn btn-success" type="submit">Guardar</button> <a class="btn btn-outline-secondary" th:href="@{/administracion/horarios}">Cancelar</a></form></div></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
