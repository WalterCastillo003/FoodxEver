<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Métodos de pago | FoodxEver</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body class="bg-light"><nav th:replace="~{fragments/navbar :: navbar('administracion')}"></nav><main class="container py-5"><div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><a th:href="@{/administracion}" class="text-success text-decoration-none">← Administración</a><h1 class="h2 fw-bold mt-2">Métodos de pago</h1><p class="text-secondary mb-0">Gestiona las opciones que aparecen al registrar pagos.</p></div><a class="btn btn-success" th:href="@{/administracion/metodos-pago/nuevo}">Nuevo método</a></div><div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-success"><tr><th>ID</th><th>Nombre</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead><tbody><tr th:each="metodo : ${metodosPago}"><td th:text="${metodo.id}"></td><td class="fw-semibold" th:text="${metodo.nombre}"></td><td><span class="badge" th:classappend="${metodo.activo ? ' text-bg-success' : ' text-bg-secondary'}" th:text="${metodo.activo ? 'Activo' : 'Inactivo'}"></span></td><td class="text-end text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/administracion/metodos-pago/editar/{id}(id=${metodo.id})}"><i class="bi bi-pencil"></i></a> <form class="d-inline" method="post" th:action="@{/administracion/metodos-pago/eliminar/{id}(id=${metodo.id})}" onsubmit="return confirm('¿Eliminar este método?')"><button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button></form></td></tr><tr th:if="${#lists.isEmpty(metodosPago)}"><td colspan="4" class="text-center text-secondary py-4">No hay métodos de pago.</td></tr></tbody></table></div></div><p class="small text-secondary mt-3">No se permite eliminar ni desactivar métodos que estén vinculados a pagos existentes.</p></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
