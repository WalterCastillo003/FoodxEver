<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Categoría | FoodxEver</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body class="bg-light"><nav th:replace="~{fragments/navbar :: navbar('administracion')}"></nav><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><a th:href="@{/administracion/categorias}" class="text-success text-decoration-none">← Volver a categorías</a><div class="card border-0 shadow-sm mt-3"><div class="card-body p-4"><h1 class="h3 fw-bold" th:text="${modoEdicion ? 'Editar categoría' : 'Nueva categoría'}"></h1><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form method="post" th:action="${formAction}" th:object="${categoria}"><div class="mb-3"><label class="form-label">Nombre</label><input class="form-control" th:field="*{nombre}" maxlength="70" required></div><div class="mb-3"><label class="form-label">Tipo de establecimiento</label><select class="form-select" th:field="*{tipoEstablecimiento}" required><option value="">Seleccionar</option><option th:each="tipo : ${tiposEstablecimiento}" th:value="${tipo}" th:text="${tipo}"></option></select></div><div class="mb-3"><label class="form-label">Descripción</label><textarea class="form-control" th:field="*{descripcion}" rows="3" maxlength="250"></textarea></div><div class="form-check mb-4"><input class="form-check-input" type="checkbox" th:field="*{activa}"><label class="form-check-label">Categoría activa</label></div><button class="btn btn-success" type="submit">Guardar</button> <a class="btn btn-outline-secondary" th:href="@{/administracion/categorias}">Cancelar</a></form></div></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
