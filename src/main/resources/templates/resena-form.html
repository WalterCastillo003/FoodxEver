<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${modoEdicion ? 'Editar reseña' : 'Nueva reseña'} + ' | FoodxEver'">Reseña | FoodxEver</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar('resenas')}"></nav>
<main class="py-5 bg-light min-vh-100"><div class="container" style="max-width: 850px;">
    <div class="mb-4"><a th:href="@{/resenas}" class="text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Volver a reseñas</a>
        <h1 class="fw-bold mt-3" th:text="${modoEdicion ? 'Editar reseña' : 'Registrar reseña'}">Registrar reseña</h1>
        <p class="text-secondary">Relaciona la valoración con un usuario y un establecimiento.</p>
    </div>
    <div class="alert alert-danger" th:if="${error != null}" th:text="${error}"></div>
    <div class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5">
        <form th:action="${formAction}" method="post">
            <div class="mb-3">
                <label for="usuarioId" class="form-label fw-semibold">Usuario</label>
                <select id="usuarioId" name="usuarioId" class="form-select" required>
                    <option value="">Selecciona un usuario...</option>
                    <option th:each="usuario : ${usuarios}" th:value="${usuario.id}"
                            th:selected="${usuario.id == usuarioSeleccionadoId}"
                            th:text="${usuario.nombre + ' (' + usuario.correo + ')'}">Usuario</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="establecimientoId" class="form-label fw-semibold">Establecimiento</label>
                <select id="establecimientoId" name="establecimientoId" class="form-select" required>
                    <option value="">Selecciona un establecimiento...</option>
                    <option th:each="establecimiento : ${establecimientos}" th:value="${establecimiento.id}"
                            th:selected="${establecimiento.id == establecimientoSeleccionadoId}"
                            th:text="${establecimiento.nombre + ' — ' + establecimiento.categoria}">Establecimiento</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="reservaId" class="form-label fw-semibold">Reserva relacionada (opcional)</label>
                <select id="reservaId" name="reservaId" class="form-select">
                    <option value="" th:selected="${reservaSeleccionadaId == null}">Sin reserva asociada</option>
                    <option th:each="reserva : ${reservas}" th:value="${reserva.id}"
                            th:selected="${reserva.id == reservaSeleccionadaId}"
                            th:text="${'#' + reserva.id + ' · ' + reserva.cliente + ' · ' + reserva.productoNombre}">Reserva</option>
                </select>
                <div class="form-text">Si seleccionas una reserva, debe pertenecer al establecimiento indicado y no tener otra reseña.</div>
            </div>
            <div class="mb-3">
                <label for="calificacion" class="form-label fw-semibold">Calificación</label>
                <select id="calificacion" name="calificacion" class="form-select" required>
                    <option value="5" th:selected="${resena.calificacion == 5}">5 — Excelente</option>
                    <option value="4" th:selected="${resena.calificacion == 4}">4 — Muy buena</option>
                    <option value="3" th:selected="${resena.calificacion == 3}">3 — Buena</option>
                    <option value="2" th:selected="${resena.calificacion == 2}">2 — Regular</option>
                    <option value="1" th:selected="${resena.calificacion == 1}">1 — Mala</option>
                </select>
            </div>
            <div class="mb-4">
                <label for="comentario" class="form-label fw-semibold">Comentario (opcional)</label>
                <textarea id="comentario" name="comentario" class="form-control" rows="4" maxlength="800"
                          th:text="${resena.comentario}" placeholder="Cuéntanos cómo fue tu experiencia..."></textarea>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-success" type="submit"><i class="bi bi-check-circle me-1"></i><span th:text="${modoEdicion ? 'Guardar cambios' : 'Registrar reseña'}">Guardar</span></button>
                <a class="btn btn-outline-secondary" th:href="@{/resenas}">Cancelar</a>
            </div>
        </form>
    </div></div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
