<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Detalle de reserva | FoodxEver</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    >

</head>


<body class="bg-light">


    <nav th:replace="~{fragments/navbar :: navbar('reservas')}" class="navbar navbar-dark bg-success">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                th:href="@{/}"
            >

                <i class="bi bi-basket2-fill me-2"></i>

                FoodxEver

            </a>

        </div>

    </nav>



    <main class="py-5">

        <div class="container">


            <div
                class="row justify-content-center"
            >

                <div class="col-lg-7">


                    <a
                        th:href="@{/reservas}"
                        class="btn
                        btn-outline-secondary mb-4"
                    >

                        <i class="bi bi-arrow-left"></i>

                        Volver

                    </a>



                    <div
                        class="card border-0 shadow-sm"
                    >

                        <div
                            class="card-body p-5"
                        >


                            <div
                                class="d-flex
                                justify-content-between
                                align-items-start
                                gap-3"
                            >

                                <div>

                                    <span
                                        class="text-success fw-bold"
                                    >
                                        RESERVA
                                        #<span
                                            th:text="${reserva.id}"
                                        ></span>
                                    </span>


                                    <h1
                                        class="h2 fw-bold mt-2"
                                        th:text="${reserva.productoNombre}"
                                    >
                                        Producto
                                    </h1>

                                </div>



                                <span
                                    th:if="${reserva.estado == 'Pendiente'}"
                                    class="badge
                                    bg-warning
                                    text-dark fs-6"
                                >
                                    Pendiente
                                </span>


                                <span
                                    th:if="${reserva.estado == 'Completada'}"
                                    class="badge
                                    bg-success fs-6"
                                >
                                    Completada
                                </span>


                                <span
                                    th:if="${reserva.estado == 'Cancelada'}"
                                    class="badge
                                    bg-danger fs-6"
                                >
                                    Cancelada
                                </span>


                            </div>



                            <hr class="my-4">



                            <div class="row g-4">


                                <div class="col-md-6">

                                    <small
                                        class="text-secondary"
                                    >
                                        Cliente
                                    </small>


                                    <h5
                                        th:text="${reserva.cliente}"
                                    >
                                        Cliente
                                    </h5>

                                </div>



                                <div class="col-md-6">

                                    <small
                                        class="text-secondary"
                                    >
                                        Producto
                                    </small>


                                    <h5
                                        th:text="${reserva.productoNombre}"
                                    >
                                        Producto
                                    </h5>

                                </div>



                                <div class="col-md-6">

                                    <small
                                        class="text-secondary"
                                    >
                                        Cantidad
                                    </small>


                                    <h5
                                        th:text="${reserva.cantidad}"
                                    >
                                        1
                                    </h5>

                                </div>



                                <div class="col-md-6">

                                    <small
                                        class="text-secondary"
                                    >
                                        Total
                                    </small>


                                    <h4
                                        class="text-success fw-bold"
                                        th:text="'S/ ' + ${#numbers.formatDecimal(reserva.total, 1, 2)}"
                                    >
                                        S/ 0.00
                                    </h4>

                                </div>


                            </div>



                            <hr class="my-4">



                            <div class="d-flex flex-wrap gap-2">


                                <a
                                    th:href="@{/reservas/editar/{id}(id=${reserva.id})}"
                                    class="btn btn-success"
                                >

                                    <i class="bi bi-pencil me-1"></i>

                                    Editar

                                </a>



                                <form
                                    th:if="${reserva.estado == 'Pendiente'}"
                                    th:action="@{/reservas/completar/{id}(id=${reserva.id})}"
                                    method="post"
                                >

                                    <button
                                        type="submit"
                                        class="btn
                                        btn-outline-success"
                                    >
                                        Completar
                                    </button>

                                </form>



                                <form
                                    th:if="${reserva.estado == 'Pendiente'}"
                                    th:action="@{/reservas/cancelar/{id}(id=${reserva.id})}"
                                    method="post"
                                >

                                    <button
                                        type="submit"
                                        class="btn
                                        btn-outline-danger"
                                    >
                                        Cancelar reserva
                                    </button>

                                </form>


                            </div>


                        </div>

                    </div>


                </div>

            </div>

        </div>

    </main>


</body>

</html>
