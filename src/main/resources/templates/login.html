<!DOCTYPE html>

<html
    lang="es"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión | FoodxEver</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    >


    <link
        rel="stylesheet"
        th:href="@{/css/styles.css}"
    >

</head>


<body class="bg-light">


    <nav
        th:replace="~{fragments/navbar :: navbar('login')}"
    ></nav>



    <main class="py-5">

        <div class="container">

            <div
                class="row justify-content-center"
            >

                <div
                    class="col-md-8 col-lg-5"
                >

                    <div
                        class="card border-0 shadow-sm"
                    >

                        <div
                            class="card-body p-4 p-md-5"
                        >


                            <div
                                class="text-center mb-4"
                            >

                                <div
                                    class="display-5
                                    text-success mb-3"
                                >

                                    <i
                                        class="bi bi-person-circle"
                                    ></i>

                                </div>


                                <h1
                                    class="h3 fw-bold"
                                >
                                    Iniciar sesión
                                </h1>


                                <p
                                    class="text-secondary"
                                >
                                    Accede a tu cuenta
                                    de FoodxEver.
                                </p>

                            </div>



                            <div
                                class="alert alert-danger"
                                th:if="${error}"
                                th:text="${error}"
                            >
                            </div>



                            <form
                                th:action="@{/login}"
                                method="post"
                            >


                                <div class="mb-3">

                                    <label
                                        for="correo"
                                        class="form-label fw-semibold"
                                    >
                                        Correo electrónico
                                    </label>


                                    <input
                                        type="email"
                                        id="correo"
                                        name="correo"
                                        class="form-control"
                                        th:value="${correo}"
                                        placeholder="correo@ejemplo.com"
                                        required
                                    >

                                </div>



                                <div class="mb-4">

                                    <label
                                        for="contrasena"
                                        class="form-label fw-semibold"
                                    >
                                        Contraseña
                                    </label>


                                    <input
                                        type="password"
                                        id="contrasena"
                                        name="contrasena"
                                        class="form-control"
                                        minlength="6"
                                        required
                                    >

                                </div>



                                <div class="d-grid">

                                    <button
                                        type="submit"
                                        class="btn
                                        btn-success
                                        btn-lg"
                                    >

                                        <i
                                            class="bi bi-box-arrow-in-right me-1"
                                        ></i>

                                        Iniciar sesión

                                    </button>

                                </div>


                            </form>



                            <hr class="my-4">



                            <p
                                class="text-center
                                text-secondary mb-0"
                            >

                                ¿No tienes una cuenta?

                                <a
                                    th:href="@{/registro}"
                                    class="text-success
                                    fw-semibold"
                                >
                                    Regístrate
                                </a>

                            </p>


                            <div
                                class="alert alert-light
                                border mt-4 mb-0"
                            >

                                <small>

                                    <strong>
                                        Cuenta de prueba:
                                    </strong>

                                    <br>

                                    demo@foodxever.com

                                    <br>

                                    Contraseña: 123456

                                </small>

                            </div>


                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


</body>

</html>
