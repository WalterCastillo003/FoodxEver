spring.application.name=foodxever
server.port=${PORT:8080}

# PostgreSQL local por defecto. En Railway se reemplazan estas variables
# desde el panel del servicio, sin guardar secretos en el repositorio.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/foodxever}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Para el avance académico, Hibernate crea las tablas que falten y actualiza
# columnas nuevas sin borrar los registros existentes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
